name: suite_场景补充_011_s1_suite
app: deepin-voice-note
module: 场景补充
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_场景补充_011_s1
  name: 重命名文本笔记后列表仍可用
  description: 覆盖1634951；新建文本笔记后右键重命名并确认，验证记事本/笔记列表入口仍可见（时间排序置顶依赖人工核对）
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.5
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: rename_move_top_seed
    wait: 0.4
  - step_type: action
    action: dtk_context_menu
    selector:
      name: 文本
      role: list item
    items:
    - 重命名
    wait: 0.8
  - step_type: action
    action: keyboard_type
    text: rename_move_top_001
    wait: 0.4
  - step_type: action
    action: keyboard_press
    key: Return
    wait: 0.8
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
  skip: timestamp / list-order "move to top" after rename needs visual/manual check;
    VNoteRightMenu Accessible.name may flake on dtk_context_menu
