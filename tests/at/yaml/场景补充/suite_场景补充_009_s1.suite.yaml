name: suite_场景补充_009_s1_suite
app: deepin-voice-note
module: 场景补充
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_场景补充_009_s1
  name: 主界面列表收起展开与窗口快捷键稳定性
  description: 覆盖1676379；点击侧栏收起/展开，再 Alt+F10/F9 切换窗口，验证主界面仍可用
  steps:
  - step_type: action
    action: element_action
    selector:
      name: TwoColumnModeButton
    do: click
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: TwoColumnModeButton
    do: click
    wait: 0.5
  - step_type: action
    action: keyboard_hot_key
    key: Alt+F10
    wait: 0.5
  - step_type: action
    action: keyboard_hot_key
    key: Alt+F10
    wait: 0.5
  - step_type: action
    action: keyboard_hot_key
    key: Alt+F9
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_process_running
    process: deepin-voice-note
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
