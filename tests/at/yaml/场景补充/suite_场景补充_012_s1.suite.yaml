name: suite_场景补充_012_s1_suite
app: deepin-voice-note
module: 场景补充
setup:
- action: session_start
  command: >-
    bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=9222; SINK=$(pactl get-default-sink 2>/dev/null || true); if [ -n "$SINK" ]; then pactl set-default-sink "$SINK" 2>/dev/null || true; pactl set-default-source "$SINK.monitor" 2>/dev/null || true; fi; exec ./tests/at/setup_voice_note_at.sh'
  wait: 8.0
teardown:
- action: session_stop
suites:
- id: suite_场景补充_012_s1
  name: 删除语音记录后主界面仍可用
  description: 覆盖1634899；先写入正文并录制语音，再通过语音块右键删除该语音，验证主窗口与笔记列表仍可用（列表时间置顶依赖人工核对）
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.5
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: delete_voice_move_top_seed
    wait: 0.4
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.8
    note: 再建一条笔记，便于观察删除语音后排序变化（人工）
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: delete_voice_target_note
    wait: 0.4
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      script: |
        (function(){
          const btn = document.querySelector('button[data-format="insertVoice"]');
          if (!btn) throw new Error('insertVoice button not found');
          btn.click();
          return true;
        })()
    wait: 1.0
  - step_type: assert
    action: assert_element
    selector:
      name: PauseButton
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/play_loopback_audio.sh tests/at/fixtures/tengwanggexu.mp3 5'
    wait: 0.5
    note: command 播环回音频；禁止 session_start（会覆盖 app_process）
  - step_type: action
    action: element_action
    selector:
      name: StopButton
    do: click
    wait: 2.0
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 20
      script: |
        (function(){
          return new Promise(function(resolve, reject){
            const deadline = Date.now() + 15000;
            function poll(){
              const count = document.querySelectorAll('.voiceInfoBox[data-type="voice-block"]').length;
              if (count > 0) return resolve({voiceCount: count});
              if (Date.now() > deadline) return reject(new Error('voice block not generated'));
              setTimeout(poll, 300);
            }
            poll();
          });
        })()
    wait: 0.5
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 8
      script: |
        (function(){
          window.__dvnTiptapContextTranscript = null;
          const vb = document.querySelector('.voiceInfoBox[data-type="voice-block"]');
          if (!vb) throw new Error('voice block missing before delete');
          if (typeof window.__dvnTiptapSelectVoiceBlockFromElement === 'function') {
            window.__dvnTiptapSelectVoiceBlockFromElement(vb);
          }
          return {selected: true};
        })()
    wait: 0.3
  - step_type: action
    action: webengine_mouse_event
    value:
      port: 9222
      target_url_contains: tiptap-editor
      selector: .voiceBtn
      button: right
    wait: 1.0
    note: 右键 .voiceBtn 保证弹出语音菜单（VoiceDelete→deleteSelection）
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/click_visible_menu_item.py 删除 --timeout 8'
    wait: 1.5
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 15
      script: |
        (function(){
          return new Promise(function(resolve, reject){
            const deadline = Date.now() + 12000;
            function poll(){
              const count = document.querySelectorAll('.voiceInfoBox[data-type="voice-block"]').length;
              if (count === 0) return resolve({voiceCount: 0});
              if (Date.now() > deadline) return reject(new Error('voice block still present after delete, count=' + count));
              setTimeout(poll, 300);
            }
            poll();
          });
        })()
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
  - step_type: assert
    action: assert_element
    selector:
      name: TiptapWebView
