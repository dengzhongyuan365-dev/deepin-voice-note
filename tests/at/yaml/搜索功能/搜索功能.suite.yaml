name: 搜索功能_suite
app: deepin-voice-note
module: 搜索功能
setup:
- action: session_start
  command: deepin-voice-note
  wait: 3.0
suites:
- id: suite_搜索功能_001_s1
  name: 搜索框输入关键字显示搜索结果
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+f
  - step_type: action
    action: keyboard_type
    text: 测试
  - step_type: action
    action: keyboard_press
    key: Return
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
teardown:
- action: session_stop
