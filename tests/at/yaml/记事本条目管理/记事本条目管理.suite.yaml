name: 记事本条目管理_suite
app: deepin-voice-note
module: 记事本条目管理
setup:
- action: session_start
  command: deepin-voice-note
  wait: 3.0
suites:
- id: suite_记事本条目管理_001_s1
  name: 新建记事本验证
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: CreateFolderButton
    do: click
  - step_type: action
    action: keyboard_type
    text: 测试记事本
  - step_type: action
    action: keyboard_press
    key: Return
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: FolderListView
  - step_type: assert
    action: assert_element
    selector:
      name: model.name
  - step_type: assert
    action: assert_element
    selector:
      name: FolderListScrollBar
- id: suite_记事本条目管理_002_s1
  name: 记事本右键菜单操作
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: FolderListView
    do: right_click
  - step_type: action
    action: dtk_context_menu
    items:
    - 重命名
    - 删除
    - 新建笔记
  - step_type: action
    action: keyboard_press
    key: Escape
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: FolderItemContextMenu
  - step_type: assert
    action: assert_element
    selector:
      name: RenameMenuItem
  - step_type: assert
    action: assert_element
    selector:
      name: DeleteFolderMenuItem
  - step_type: assert
    action: assert_element
    selector:
      name: NewNoteFromFolderMenuItem
- id: suite_记事本条目管理_003_s1
  name: 删除记事本确认对话框
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: FolderListView
    do: right_click
  - step_type: action
    action: dtk_context_menu
    items:
    - 删除
  - step_type: action
    action: keyboard_press
    key: Return
  - step_type: action
    action: element_action
    selector:
      name: CancelButton
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: FolderMessageDialogLoader
  - step_type: assert
    action: assert_element
    selector:
      name: CancelButton
  - step_type: assert
    action: assert_element
    selector:
      name: FolderListView
  - step_type: assert
    action: assert_element
    selector:
      name: VNoteButton
- id: suite_记事本条目管理_004_s1
  name: 记事本命名规则正向流程
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: CreateFolderButton
    do: click
  - step_type: action
    action: keyboard_type
    text: 我的记事本
  - step_type: action
    action: keyboard_press
    key: Return
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: model.name
  - step_type: assert
    action: assert_element
    selector:
      name: FolderListView
teardown:
- action: session_stop
