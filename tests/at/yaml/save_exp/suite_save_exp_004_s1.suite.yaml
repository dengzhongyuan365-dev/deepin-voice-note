name: suite_save_exp_004_s1_suite
app: deepin-voice-note
module: save_exp
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_save_exp_004_s1
  name: 空笔记_保存入口禁用
  description: 覆盖1634931；空笔记正文时右键保存笔记流程不可触发且不弹出文件保存对话框
  steps:
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/assert_empty_note_save_disabled.py --timeout 10'
    wait: 1.0
    note: 新建空笔记后真实右键笔记条目，断言保存笔记流程不可触发且无保存对话框
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - step_type: assert
    action: assert_element
    selector:
      name: TiptapWebView
