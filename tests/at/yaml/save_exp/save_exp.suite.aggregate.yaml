name: save_exp_suite
app: deepin-voice-note
module: save_exp
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_save_exp_001_s1
  name: 详情页_保存为TXT与HTML
  description: 覆盖1676345、1676347、1634939、1634933；右键笔记通过保存笔记子菜单保存为TXT和HTML格式，验证文件生成
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
  - step_type: action
    action: keyboard_type
    text: 详情页保存测试内容
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/open_note_save_as.py 保存为TXT --index 0 --timeout 15'
    wait: 1.0
  - step_type: action
    action: file_dialog_select
    path: /tmp/
    name: detail_note.txt
    wait: 3.0
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/open_note_save_as.py 保存为HTML --index 0 --timeout 15'
    wait: 1.0
  - step_type: action
    action: file_dialog_select
    path: /tmp/
    name: detail_note.html
    wait: 3.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
  - step_type: assert
    action: assert_file_exists
    path: /tmp/detail_note.txt
  - step_type: assert
    action: assert_file_exists
    path: /tmp/detail_note.html
- id: suite_save_exp_002_s1
  name: 语音保存_当前笔记全部语音
  description: 录制语音后通过笔记列表真实右键菜单打开保存语音入口，关闭后再次打开确保无异常
  steps:
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      script: "(function(){\n  const btn = document.querySelector('button[data-format=\"\
        insertVoice\"]');\n  if (!btn) throw new Error('insertVoice button not found');\n\
        \  btn.click();\n  return true;\n})()\n"
    wait: 1.0
    note: 点击 Tiptap 录音按钮
  - step_type: action
    action: session_start
    command: bash -lc 'A=tests/at/fixtures/tengwanggexu.mp3; if command -v ffplay
      >/dev/null 2>&1; then timeout 5s ffplay -nodisp -autoexit -loglevel quiet "$A";
      elif command -v paplay >/dev/null 2>&1; then timeout 5s paplay "$A"; else xdg-open
      "$A"; fi'
    wait: 5.5
    note: 播放内置音频并录制约5秒
  - step_type: action
    action: element_action
    selector:
      name: StopButton
    do: click
    wait: 2.0
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 20
      script: "(function(){\n  return new Promise(function(resolve, reject){\n   \
        \ const deadline = Date.now() + 15000;\n    function poll(){\n      const\
        \ count = document.querySelectorAll('.voiceInfoBox[data-type=\"voice-block\"\
        ]').length;\n      if (count > 0) return resolve({voiceCount: count});\n \
        \     if (Date.now() > deadline) return reject(new Error('voice block not\
        \ generated'));\n      setTimeout(poll, 300);\n    }\n    poll();\n  });\n\
        })()\n"
    wait: 0.5
    note: 等待语音块生成
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/open_note_context_menu.py --index 0 --expect
      保存语音 --click-expect'
    wait: 1.0
  - step_type: action
    action: file_dialog_cancel
    wait: 1.0
    note: 取消文件保存对话框
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/open_note_context_menu.py --index 0 --expect
      保存语音 --click-expect'
    wait: 1.0
  - step_type: action
    action: file_dialog_cancel
    wait: 1.0
    note: 取消文件保存对话框
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - step_type: assert
    action: assert_element
    selector:
      name: TiptapWebView
- id: suite_save_exp_003_s1
  name: 多选笔记_工具栏保存TXT
  description: 覆盖1676325、1676323、1676321、1676313；笔记1和笔记2包含正文时通过多选工具栏保存TXT
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 1.0
    note: 创建笔记1
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: 第一条多选文本内容
    wait: 0.8
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 1.0
    note: 创建笔记2
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: 第二条多选文本内容
    wait: 0.8
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/select_two_notes_for_multiselect.py --existing --timeout 10'
    timeout: 30
    check: true
    wait: 1.0
    note: 只选中有正文的笔记1和笔记2
  - step_type: action
    action: element_action
    selector:
      name: SaveNoteButton
    do: click
    wait: 1.0
    note: 多选工具栏点击保存笔记按钮，保存TXT
  - step_type: action
    action: file_dialog_select
    path: /tmp/multi_note_txt
    wait: 4.0
    note: 选择TXT导出目录
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/assert_export_files.py --directory /tmp/multi_note_txt --extension .txt --contains 多选文本内容'
    wait: 1.0
    note: 验证TXT文件真实生成且包含正文
  # 当前产品 checkNoteText 的真实规则是“选中集合中任意一条有正文即可保存”。
  # 空笔记禁用属于独立产品规则，不在本导出成功链路中伪造断言。
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: MultipleChoicesView
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView

- id: suite_save_exp_004_s1
  name: 空笔记_保存入口禁用
  description: 覆盖1634931；空笔记正文时右键保存笔记流程不可触发且不弹出文件保存对话框
  steps:
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/assert_empty_note_save_disabled.py --timeout
      10'
    wait: 1.0
    note: 新建空笔记后真实右键笔记条目，断言保存笔记流程不可触发且无保存对话框
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - step_type: assert
    action: assert_element
    selector:
      name: TiptapWebView
