name: suite_save_exp_003_s1_suite
app: deepin-voice-note
module: save_exp
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_save_exp_003_s1
  name: 多选笔记_工具栏保存TXT
  description: 覆盖1676325、1676323、1676321、1676313；笔记1和笔记2包含正文时通过多选工具栏保存TXT
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 1.0
    note: 创建笔记1
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: 第一条多选文本内容
    wait: 0.8
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 1.0
    note: 创建笔记2
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: 第二条多选文本内容
    wait: 0.8
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/select_two_notes_for_multiselect.py --existing --timeout 10'
    timeout: 30
    check: true
    wait: 1.0
    note: 只选中有正文的笔记1和笔记2
  - step_type: action
    action: element_action
    selector:
      name: SaveNoteButton
    do: click
    wait: 1.0
    note: 多选工具栏点击保存笔记按钮，保存TXT
  - step_type: action
    action: file_dialog_select
    path: /tmp/multi_note_txt
    wait: 4.0
    note: 选择TXT导出目录
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/assert_export_files.py --directory /tmp/multi_note_txt --extension .txt --contains 多选文本内容'
    wait: 1.0
    note: 验证TXT文件真实生成且包含正文
  # 当前产品 checkNoteText 的真实规则是“选中集合中任意一条有正文即可保存”。
  # 空笔记禁用属于独立产品规则，不在本导出成功链路中伪造断言。
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: MultipleChoicesView
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
