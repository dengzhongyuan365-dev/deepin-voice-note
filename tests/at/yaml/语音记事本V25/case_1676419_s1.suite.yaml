name: case_1676419_s1_suite
app: deepin-voice-note
module: 语音记事本V25
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: case_1676419_s1
  name: 删除笔记-通过快捷键操作
  description: 覆盖1676419；选中笔记后通过真实右键菜单触发删除，验证删除确认弹窗出现；Alt+M 在源码中绑定编辑区 JS 菜单，笔记列表删除以右键菜单为准
  steps:
  - step_type: action
    action: mouse_click
    selector:
      name: NoteItemListView
    wait: 0.5
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/open_note_context_menu.py --index 0 --expect 删除 --click-expect --timeout 15'
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: 删除
      role: button
    note: 删除确认弹窗确认按钮文案为「删除」
  - step_type: assert
    action: assert_element
    selector:
      name: CancelButton
