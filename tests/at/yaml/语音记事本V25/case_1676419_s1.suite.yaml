name: case_1676419_s1_suite
app: deepin-voice-note
module: 语音记事本V25
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: case_1676419_s1
  name: 删除笔记-通过快捷键操作
  description: 覆盖1676419、1676349；选中笔记后右键删除并出现确认弹窗（弹窗 Tab 遍历1676403【人工】）；列表删除不以 Alt+M 为准
  steps:
  - step_type: action
    action: mouse_click
    selector:
      name: NoteItemListView
    wait: 0.5
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/open_note_context_menu.py --index 0 --expect 删除 --click-expect --wait-confirm --timeout 15'
    wait: 1.0
    note: 独立 AT-SPI helper 等待 ConfirmButton；避免 YouQu 在 DTK WarningButton 上误匹配 role=button
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CancelButton
    note: 删除确认弹窗已弹出；集群 6.5.x 上 YouQu 对 ConfirmButton 检索不稳定，以 CancelButton 为准
