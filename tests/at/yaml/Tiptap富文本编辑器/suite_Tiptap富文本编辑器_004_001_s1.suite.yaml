name: suite_Tiptap富文本编辑器_004_001_s1_suite
app: deepin-voice-note
description: |
  S004-001：Tiptap 图片插入、编辑和持久化。
  目标：验证 Summernote 切换到 Tiptap 后，剪贴板图片可插入为 image node，图片前后仍可输入文本，切换笔记后 DB 中保留 Tiptap JSON 与图片文件。
module: Tiptap富文本编辑器
tags:
- L1
- smoke
- tiptap
- image
fast_fail: false
env_check: []
trace:
  feature: Summernote 切换到 Tiptap 富文本编辑器
  scenario: S004-001
  expected: tests/at/expected/tiptap_scenario_004_001_expected.yaml
  source_cases:
  - id: '1676377'
    title: 插入图片显示在编辑区输入焦点所在位置
    relation: equivalent
  - id: '1676231'
    title: 导入图片---粘贴图片至编辑区
    relation: equivalent
setup:
- action: session_start
  command: bash -lc 'pkill -x xclip 2>/dev/null || true; command -v xclip >/dev/null || { echo xclip is required for clipboard image paste >&2; exit 127; }; xclip -selection clipboard -target image/png -i ./tests/at/fixtures/tiptap_s004_image.png -loops 20 >/dev/null 2>&1 & exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_Tiptap富文本编辑器_004_001_s1
  name: 图片粘贴插入并持久化
  description: |
    基于稳定 fixture 启动应用后，新建记事本和文本笔记；在 Tiptap 编辑区通过系统剪贴板粘贴 PNG 图片；切换笔记触发保存，并由 DB 预期模板验证 image node 与图片文件。
  tags:
  - L1
  - smoke
  - tiptap
  - image
  steps:
  - action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - action: assert_element
    selector:
      name: TiptapWebView
  - action: element_action
    selector:
      name: CreateFolderButton
      role: button
    do: click
    wait: 0.8
  - action: assert_element
    selector:
      name: 记事本2
      role: label
  - action: element_action
    selector:
      name: NewNoteButton
      role: button
    do: click
    wait: 1.0
  - action: assert_element
    selector:
      name: 未命名文本2
      role: label
  - action: element_action
    selector:
      name: TiptapWebView
    do: click
    wait: 0.5
  - action: keyboard_hot_key
    key: ctrl+v
    wait: 3.0
  - action: element_action
    selector:
      name: NewNoteButton
      role: button
    do: click
    wait: 1.0
  - action: assert_element
    selector:
      name: 未命名文本3
      role: label
  - action: element_action
    selector:
      name: 未命名文本2
      role: label
    do: click
    wait: 0.8
  - action: assert_element
    selector:
      name: TiptapWebView
  - action: wait
    wait: 0.5
  assert_steps:
  - action: assert_process_running
    app: deepin-voice-note
  - action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - action: assert_element
    selector:
      name: 记事本2
      role: label
  - action: assert_element
    selector:
      name: 未命名文本2
      role: label
  - action: assert_element
    selector:
      name: 未命名文本3
      role: label
  - action: assert_element
    selector:
      name: TiptapWebView
