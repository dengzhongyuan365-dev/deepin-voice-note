name: suite_Tiptap富文本编辑器_005_001_s1_suite
app: deepin-voice-note
description: |
  S005-001：旧 Summernote 数据迁移到 Tiptap - 旧文本笔记迁移后可打开。
  目标：验证已有用户的旧 Summernote HTML 数据在切换到 Tiptap 后，
  迁移逻辑正确触发，旧笔记可正常打开，TiptapWebView 可用，DB 中旧内容不丢失。
module: Tiptap富文本编辑器
tags:
- L1
- smoke
- tiptap
- migration
fast_fail: false
env_check: []
trace:
  feature: Summernote 切换到 Tiptap 富文本编辑器
  scenario: S005-001
  expected: tests/at/expected/tiptap_scenario_005_001_expected.yaml
  source_cases:
  - id: '1884375'
    title: 语音记事本基本功能验证
    relation: partial
  - id: '1634905'
    title: 重启应用查看笔记列表默认选中第一条
    relation: partial
  - id: '1634907'
    title: 切换笔记，详情页同步切换
    relation: partial
  - id: '1634959'
    title: 点击文本笔记详情页的文本区域编辑文字内容
    relation: partial
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_legacy_migration_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_Tiptap富文本编辑器_005_001_s1
  name: 旧文本笔记迁移后可打开
  description: |
    使用包含旧 Summernote HTML 内容的 fixture 启动应用，触发迁移逻辑；
    打开旧文本笔记后验证 TiptapWebView 可用，应用进程无异常。
  tags:
  - L1
  - smoke
  - tiptap
  - migration
  steps:
  - action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - action: assert_element
    selector:
      name: 记事本1
      role: label
  - action: element_action
    selector:
      name: 记事本1
      role: label
    do: click
    wait: 1.0
  - action: assert_element
    selector:
      name: 文本
      role: label
  - action: element_action
    selector:
      name: 文本
      role: label
    do: click
    wait: 1.0
  - action: assert_element
    selector:
      name: TiptapWebView
  - action: wait
    wait: 0.5
  assert_steps:
  - action: assert_process_running
    app: deepin-voice-note
  - action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - action: assert_element
    selector:
      name: TiptapWebView
