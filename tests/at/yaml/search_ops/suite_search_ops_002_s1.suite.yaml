name: suite_search_ops_002_s1_suite
app: deepin-voice-note
module: search_ops
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_search_ops_002_s1
  name: 搜索结果_删除匹配项
  description: 覆盖1635203、1635191；搜索结果页右键笔记删除单条后结果数量减少，删除所有后搜索结果页显示无结果
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.5
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: search_delete_001
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.5
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: search_delete_001
    wait: 0.5
    note: 再建一条同关键字笔记，便于删除后仍有匹配项
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/focus_search_and_query.py search_delete_001'
    wait: 1.0
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/open_note_context_menu.py --index 0 --expect 删除 --click-expect --confirm-after --timeout 15'
    wait: 1.0
    note: 用独立 AT-SPI helper；避免 dtk_context_menu 超时及 ConfirmButton 未弹出
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/open_note_context_menu.py --index 0 --expect 删除 --click-expect --confirm-after --timeout 15'
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
