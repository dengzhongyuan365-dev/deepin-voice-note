name: suite_search_ops_006_s1_suite
app: deepin-voice-note
module: search_ops
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_search_ops_006_s1
  name: 搜索结果_新建笔记菜单置灰入口可见
  description: 覆盖1635197；搜索有结果后右键笔记，验证「新建笔记」菜单项仍出现在右键菜单中（产品在搜索态置灰不可用）
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.5
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: search_newnote_disabled_001
    wait: 0.5
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/focus_search_and_query.py search_newnote_disabled_001'
    wait: 1.0
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/open_note_context_menu.py --index 0 --expect 新建笔记 --timeout 12'
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
  skip: product disables NoteAddNew while isSearching; AT asserts menu item presence
    only (enabled/grayed state not expressible without assert_action_disabled); search
    box lacks Accessible.name
