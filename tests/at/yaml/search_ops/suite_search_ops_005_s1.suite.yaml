name: suite_search_ops_005_s1_suite
app: deepin-voice-note
module: search_ops
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_search_ops_005_s1
  name: 搜索结果_重命名匹配与不匹配关键字
  description: 覆盖1635189；搜索有结果后右键重命名文本笔记（关键字匹配与不匹配各一次），验证主窗口与列表仍可用
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.5
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: search_rename_kw
    wait: 0.5
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/focus_search_and_query.py search_rename_kw'
    timeout: 30
    check: true
    wait: 1.0
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/open_note_context_menu.py --index 0 --expect 重命名 --click-expect --timeout 15'
    timeout: 40
    check: true
    wait: 0.8
  - step_type: action
    action: keyboard_type
    text: search_rename_kw
    wait: 0.4
  - step_type: action
    action: keyboard_press
    key: Return
    wait: 0.8
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/focus_search_and_query.py search_rename_kw'
    timeout: 30
    check: true
    wait: 1.0
    note: 重命名后重新搜索，保证结果列表仍有可右键项
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/open_note_context_menu.py --index 0 --expect 重命名 --click-expect --timeout 15'
    timeout: 40
    check: true
    wait: 0.8
  - step_type: action
    action: keyboard_type
    text: rename_nomatch_001
    wait: 0.4
  - step_type: action
    action: keyboard_press
    key: Return
    wait: 0.8
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
