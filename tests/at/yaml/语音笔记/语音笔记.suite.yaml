name: 语音笔记_suite
app: deepin-voice-note
module: 语音笔记
setup:
- action: session_start
  command: deepin-voice-note
  wait: 3.0
suites:
- id: suite_语音笔记_001_s1
  name: 录音暂停和停止
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+r
  - step_type: action
    action: element_action
    selector:
      name: PauseButton
    do: click
  - step_type: action
    action: element_action
    selector:
      name: StopButton
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: RecordingBar
  - step_type: assert
    action: assert_element
    selector:
      name: PauseButton
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
- id: suite_语音笔记_002_s1
  name: 录音界面布局验证
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+r
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: RecordingBar
  - step_type: assert
    action: assert_element
    selector:
      name: WebViewTitleBar
  - step_type: assert
    action: assert_element
    selector:
      name: WebViewMessageDialog
- id: suite_语音笔记_003_s1
  name: 语音笔记右键菜单
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
  - step_type: action
    action: element_action
    selector:
      name: NoteItemListView
    do: right_click
  - step_type: action
    action: dtk_context_menu
    items:
    - 保存为MP3
    - 复制
    - 剪切
    - 删除
  - step_type: action
    action: keyboard_press
    key: Escape
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: ActionManager.actionTextmenuItem.menuId
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
teardown:
- action: session_stop
