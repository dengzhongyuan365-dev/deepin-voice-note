name: 快捷键使用_suite
app: deepin-voice-note
module: 快捷键使用
setup:
- action: session_start
  command: deepin-voice-note
  wait: 3.0
suites:
- id: suite_快捷键使用_001_s1
  name: 快捷键功能验证
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+s
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: MainShortcuts
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
  - step_type: assert
    action: assert_element
    selector:
      name: TiptapWebView
- id: suite_快捷键使用_002_s1
  name: Delete快捷键删除笔记
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
  - step_type: action
    action: keyboard_press
    key: Delete
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
teardown:
- action: session_stop
