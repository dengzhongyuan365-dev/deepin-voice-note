name: suite_voice_ai_006_s1_suite
app: deepin-voice-note
module: voice_ai
setup:
- action: session_start
  command: >-
    bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=9222; SINK=$(pactl get-default-sink 2>/dev/null || true); if [ -z "$SINK" ] || [ "$SINK" = null-sink ]; then SINK=$(pactl list short sinks | awk '\''$2 != "null-sink" {print $2; exit}'\''); fi; if [ -n "$SINK" ]; then pactl set-default-sink "$SINK" 2>/dev/null || true; pactl set-default-source "$SINK.monitor" 2>/dev/null || true; fi; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_voice_ai_006_s1
  name: 删除语音同步清理转写文案
  description: 覆盖1676441；录音并触发语音转文字后删除该语音块，验证转写文案节点同步消失
  steps:
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      script: |
        (function(){
          const btn = document.querySelector('button[data-format="insertVoice"]');
          if (!btn) throw new Error('insertVoice button not found');
          btn.click();
          return true;
        })()
    wait: 1.0
  - step_type: action
    action: session_start
    command: >-
      bash -lc 'A=tests/at/fixtures/tengwanggexu.mp3; if command -v ffplay >/dev/null 2>&1; then timeout 5s ffplay -nodisp -autoexit -loglevel quiet "$A"; elif command -v paplay >/dev/null 2>&1; then timeout 5s paplay "$A"; else xdg-open "$A"; fi'
    wait: 5.5
  - step_type: action
    action: element_action
    selector:
      name: StopButton
    do: click
    wait: 2.0
  - step_type: action
    action: webengine_mouse_event
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 10
      selector: .voiceInfoBox[data-type="voice-block"]
      button: right
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: 语音转文字
      role: menu item
    do: click
    wait: 2.0
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 60
      script: |
        (function(){
          return new Promise(function(resolve, reject){
            const deadline = Date.now() + 55000;
            function poll(){
              const textEl = document.querySelector('.translateText');
              const text = textEl ? (textEl.innerText || textEl.textContent || '').trim() : '';
              if (text) return resolve({transcriptLength: text.length});
              if (Date.now() > deadline) return reject(new Error('transcript text not generated'));
              setTimeout(poll, 500);
            }
            poll();
          });
        })()
    wait: 1.0
  - step_type: action
    action: webengine_mouse_event
    value:
      port: 9222
      target_url_contains: tiptap-editor
      selector: .voiceInfoBox[data-type="voice-block"]
      button: right
    wait: 1.0
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/click_visible_menu_item.py 删除 --timeout 8'
    wait: 1.0
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 10
      script: |
        (function(){
          const voiceCount = document.querySelectorAll('.voiceInfoBox[data-type="voice-block"]').length;
          const transcript = document.querySelector('.translateText');
          const text = transcript ? (transcript.innerText || transcript.textContent || '').trim() : '';
          if (voiceCount !== 0) throw new Error('voice block still present after delete');
          if (text) throw new Error('transcript text still present after voice delete');
          return {voiceCount: voiceCount, transcriptCleared: true};
        })()
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TiptapWebView
  - step_type: assert
    action: assert_process_running
    process: deepin-voice-note
  skip: requires working AI/network for transcript generation before delete
