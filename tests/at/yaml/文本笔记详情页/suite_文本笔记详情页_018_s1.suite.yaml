name: suite_文本笔记详情页_018_s1_suite
app: deepin-voice-note
module: 文本笔记详情页
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_文本笔记详情页_018_s1
  name: 默认保存至桌面保存为TXT
  description: ''
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.5
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: 默认保存测试内容
    wait: 0.5
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/open_note_save_as.py 保存为TXT --index 0 --timeout 15'
    wait: 1.0
    note: 用独立 AT-SPI helper；避免 dtk_context_menu 子菜单导航超时
  - step_type: action
    action: file_dialog_select
    path: /tmp/
    name: vnote_default_save.txt
    wait: 3.0
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/open_note_save_as.py 保存为TXT --index 0 --timeout 15'
    wait: 1.0
  - step_type: action
    action: file_dialog_select
    path: /tmp/
    name: vnote_default_save.txt
    wait: 3.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - step_type: assert
    action: assert_element
    selector:
      name: NoteContentWebView
  - step_type: assert
    action: assert_file_exists
    path: /tmp/
    name: vnote_default_save.txt
