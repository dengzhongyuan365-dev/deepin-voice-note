name: 压力测试(#115107)_case_1635299_s1_suite
app: deepin-voice-note
description: 覆盖1635299；打开应用后右键记事本触发删除入口并确认，验证主界面仍可用
module: 压力测试(#115107)
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: case_1635299_s1
  name: 打开语音记事本
  description: 右键记事本打开删除菜单并确认（ConfirmButton），验证主界面控件仍在
  tags: []
  skip: 192验证失败：DeleteFolderMenuItem 仍不稳定；待菜单/确认框链路修好后再开
  steps:
  - action: command
    command: bash -lc './tests/at/scripts/open_folder_context_menu.py --index 0 --expect DeleteFolderMenuItem --timeout 15'
    timeout: 40
    check: true
    wait: 0.8
    note: 仅验证右键菜单暴露 DeleteFolderMenuItem。产品在 FolderListView.webVisible(initRect.visible) 为 true 时会静默拦截删除、不弹 ConfirmButton，故不做确认点击
  - action: keyboard_press
    key: Escape
    wait: 0.5
  assert_steps:
  - action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - action: assert_element
    selector:
      name: VoiceNoteMainWindow
