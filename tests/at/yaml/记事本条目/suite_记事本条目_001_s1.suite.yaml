name: suite_记事本条目_001_s1_suite
app: deepin-voice-note
module: 记事本条目
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_记事本条目_001_s1
  name: 新建记事本-空白页与列表按钮及快捷键
  description: 覆盖列表新建按钮与 Ctrl+N 快捷键新建笔记；删除确认弹窗另有专用用例覆盖，此处不串删除以免模态框遮挡 NewNoteButton
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 1.0
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+n
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
  - step_type: assert
    action: assert_element
    selector:
      name: NewNoteButton
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
