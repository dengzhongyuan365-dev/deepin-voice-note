name: multi_sel_suite
app: deepin-voice-note
module: multi_sel
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_multi_sel_001_s1
  name: Ctrl与Shift选择和取消选择笔记
  description: 覆盖1676335、1676329、1676331；创建5条文本笔记后通过Ctrl+click追加选择第三条、Shift+click范围选择第五条，验证多选状态
  steps:
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/multi_select_five_notes.py'
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: MultipleChoicesView
  - step_type: assert
    action: assert_element
    selector:
      name: MoveButton
  - step_type: assert
    action: assert_element
    selector:
      name: DeleteButton
- id: suite_multi_sel_002_s1
  name: 详情页按钮_移动与删除
  description: 覆盖1676327、1676319；多选笔记后验证详情页移动按钮可见，确认多选工具条状态可用
  steps:
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/multi_select_five_notes.py'
    wait: 2.0
  - step_type: assert
    action: assert_element
    selector:
      name: MoveButton
      role: button
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - step_type: assert
    action: assert_element
    selector:
      name: MultipleChoicesView
- id: suite_multi_sel_003_s1
  name: 右键菜单_批量保存与批量删除
  description: 覆盖1676317、1676315、1676311、1676309；多选笔记后打开右键批量菜单，触发删除入口并取消删除
  steps:
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/multi_select_five_notes.py'
    wait: 2.0
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/open_note_context_menu.py --index 0 --expect 删除 --click-expect --cancel-after --timeout 15'
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
      role: button
  - step_type: assert
    action: assert_element
    selector:
      name: MultipleChoicesView
- id: suite_multi_sel_004_s1
  name: Shift范围选中两条笔记
  description: 覆盖1676331；点击一条笔记后按住Shift再点另一条，验证进入多选工具条
  steps:
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/select_two_notes_for_multiselect.py'
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: MultipleChoicesView
  - step_type: assert
    action: assert_element
    selector:
      name: MoveButton
  - step_type: assert
    action: assert_element
    selector:
      name: DeleteButton
- id: suite_multi_sel_005_s1
  name: 多选状态下Ctrl取消选中单条
  description: 覆盖1676333；Shift选中三条后Ctrl+click取消其中一条，验证多选工具条仍在
  steps:
  - step_type: action
    action: session_start
    command: bash -lc './tests/at/scripts/ctrl_deselect_in_multiselect.py'
    wait: 3.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: MultipleChoicesView
  - step_type: assert
    action: assert_element
    selector:
      name: DeleteButton
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
