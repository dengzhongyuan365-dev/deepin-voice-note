name: edit_img(#edit_img)_case_1676439_s1_suite
app: deepin-voice-note
description: '语音转写转写文案_只读且可复制（覆盖1676439、1680885、1679613）'
module: edit_img(#edit_img)
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=9222; SINK=$(pactl get-default-sink 2>/dev/null || true); if [ -z "$SINK" ] || echo "$SINK" | grep -qi null; then SINK=$(pactl list short sinks 2>/dev/null | awk '\''tolower($2) !~ /null/ {print $2; exit}'\''); fi; if [ -n "$SINK" ]; then pactl set-default-sink "$SINK" 2>/dev/null || true; pactl set-default-source "$SINK.monitor" 2>/dev/null || true; fi; exec ./tests/at/setup_voice_note_at.sh'
  wait: 8.0
teardown:
- action: session_stop
suites:
- id: case_1676439_s1
  name: 语音转写转写文案_只读且可复制
  description: '展开语音转写文案，验证只读不可编辑，右键复制，折叠展开切换'
  tags: []
  steps:
  - action: command
    command: bash -lc './tests/at/scripts/titlebar_menu_press.py --select SettingsMenuItem --wait-visible InternalRadioButton --click-visible InternalRadioButton --timeout 8'
    wait: 1.5
    note: 打开标题栏主菜单并点击设置菜单项
  - action: keyboard_hot_key
    key: alt+F4
    wait: 1.0
    note: 使用 Alt+F4 关闭设置弹窗，回到主界面
  - action: element_action
    selector:
      name: TiptapWebView
      role: panel
    do: click
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.8
    note: 新建笔记，确保 webVisible/recordBtnEnabled 后再录音
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: at_record_seed
    wait: 0.4
  - action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      script: |
        (function(){
          const btn = document.querySelector('button[data-format=\"insertVoice\"]');
          if (!btn) throw new Error('insertVoice button not found');
          btn.click();
          return true;
        })()
    wait: 2.0
    note: 通过 QtWebEngine DevTools 执行 DOM click，点击 Tiptap 录音按钮
  - step_type: assert
    action: assert_element
    selector:
      name: PauseButton
  - action: command
    command: bash -lc './tests/at/scripts/play_loopback_audio.sh tests/at/fixtures/asr_speech_slice.mp3 12'
    wait: 0.5
    note: command 播环回音频；禁止 session_start（会覆盖 app_process）
  - action: element_action
    selector:
      name: StopButton
    do: click
    wait: 2.0
  - action: webengine_mouse_event
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 10
      selector: .voiceInfoBox[data-type="voice-block"]
      button: right
    wait: 1.0
    note: 通过 CDP 对 Tiptap 语音块发真实右键事件，触发应用原生右键菜单
  - action: element_action
    selector:
      name: 语音转文字
      role: menu item
    do: click
    wait: 2.0
    note: 点击语音块右键菜单中的语音转文字
  - action: assert_element
    selector:
      name: TiptapWebView
      role: panel
  - action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 60
      script: |
        (function(){
          return new Promise(function(resolve, reject){
            const deadline = Date.now() + 55000;
            function fail(err){ reject(err instanceof Error ? err : new Error(String(err))); }
            function withBridge(cb){
              if (window.__dvnAtTiptapBridge) return cb(window.__dvnAtTiptapBridge);
              if (typeof QWebChannel === 'undefined') return fail('QWebChannel is not loaded');
              if (!window.qt || !qt.webChannelTransport) return fail('qt.webChannelTransport is not available');
              new QWebChannel(qt.webChannelTransport, function(channel){
                window.__dvnAtTiptapBridge = channel.objects && channel.objects.tiptapChannel;
                cb(window.__dvnAtTiptapBridge);
              });
            }
            function poll(){
              const textEl = document.querySelector('.translateText');
              const text = textEl ? (textEl.innerText || textEl.textContent || '').trim() : '';
              if (text) {
                withBridge(function(bridge){
                  if (!bridge || !bridge.jsCopyPlainTextToClipboard) return fail('jsCopyPlainTextToClipboard not available');
                  bridge.jsCopyPlainTextToClipboard(text);
                  resolve({ copiedLength: text.length });
                });
                return;
              }
              if (Date.now() > deadline) return fail('transcript text not generated');
              setTimeout(poll, 500);
            }
            poll();
          });
        })()
    wait: 1.0
    note: 等待转写文案生成后通过 QWebChannel 复制转写文本，不使用右键坐标菜单
  - action: element_action
    selector:
      name: TiptapWebView
      role: panel
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: TiptapWebView
      role: panel
