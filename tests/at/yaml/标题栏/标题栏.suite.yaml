name: 标题栏_suite
app: deepin-voice-note
module: 标题栏
setup:
- action: session_start
  command: deepin-voice-note
  wait: 3.0
suites:
- id: suite_标题栏_001_s1
  name: 关闭主界面-标题栏菜单
  description: ''
  steps:
  - step_type: action
    action: dtk_main_menu
    items:
    - 设置
    - 隐私政策
    - 退出
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - step_type: assert
    action: assert_element
    selector:
      name: TitleBarMenu
  - step_type: assert
    action: assert_element
    selector:
      name: SettingsMenuItem
  - step_type: assert
    action: assert_element
    selector:
      name: PrivacyPolicyMenuItem
  - step_type: assert
    action: assert_element
    selector:
      name: ExitMenuItem
teardown:
- action: session_stop
