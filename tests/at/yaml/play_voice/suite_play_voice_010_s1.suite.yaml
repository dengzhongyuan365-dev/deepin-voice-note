name: suite_play_voice_010_s1_suite
app: deepin-voice-note
module: play_voice
setup:
- action: session_start
  command: >-
    bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=9222; SINK=$(pactl get-default-sink 2>/dev/null || true); if [ -n "$SINK" ]; then pactl set-default-sink "$SINK" 2>/dev/null || true; pactl set-default-source "$SINK.monitor" 2>/dev/null || true; fi; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_play_voice_010_s1
  name: 焦点录音按钮回车开始与播放条回车
  description: 覆盖1676409、1676407；聚焦详情区后通过录音按钮启动录音并完成；再播放语音后用 Space 切换（播放插件回车入口人工）
  steps:
  - step_type: action
    action: element_action
    selector:
      name: TiptapWebView
    do: focus
    wait: 0.3
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      script: |
        (function(){
          const btn = document.querySelector('button[data-format="insertVoice"]');
          if (!btn) throw new Error('insertVoice button not found');
          btn.focus();
          btn.click();
          return true;
        })()
    wait: 1.0
    note: 聚焦并触发录音入口（等价回车开始录音）
  - step_type: action
    action: session_start
    command: >-
      bash -lc 'A=tests/at/fixtures/tengwanggexu.mp3; if command -v ffplay >/dev/null 2>&1; then timeout 5s ffplay -nodisp -autoexit -loglevel quiet "$A"; elif command -v paplay >/dev/null 2>&1; then timeout 5s paplay "$A"; else xdg-open "$A"; fi'
    wait: 5.5
  - step_type: assert
    action: assert_element
    selector:
      name: StopButton
  - step_type: action
    action: element_action
    selector:
      name: StopButton
    do: click
    wait: 2.0
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 20
      script: |
        (function(){
          return new Promise(function(resolve, reject){
            const deadline = Date.now() + 15000;
            function poll(){
              const count = document.querySelectorAll('.voiceInfoBox[data-type="voice-block"]').length;
              if (count > 0) return resolve({voiceCount: count});
              if (Date.now() > deadline) return reject(new Error('voice block not generated'));
              setTimeout(poll, 300);
            }
            poll();
          });
        })()
    wait: 0.5
  - step_type: action
    action: webengine_mouse_event
    value:
      port: 9222
      target_url_contains: tiptap-editor
      selector: .voiceBtn
      button: left
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: TiptapWebView
    do: focus
    wait: 0.3
  - step_type: action
    action: keyboard_press
    key: space
    wait: 0.8
  - step_type: action
    action: keyboard_press
    key: space
    wait: 0.8
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TiptapWebView
  - step_type: assert
    action: assert_process_running
    process: deepin-voice-note
  skip: native Return-on-focused-record-button and play-plugin Enter close path soft-covered
    via click/Space; exact focus chain may differ by toolkit
