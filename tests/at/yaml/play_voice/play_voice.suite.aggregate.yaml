name: play_voice_suite
app: deepin-voice-note
module: play_voice
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=9222; SINK=$(pactl get-default-sink
    2>/dev/null || true); if [ -n "$SINK" ]; then pactl set-default-sink "$SINK" 2>/dev/null
    || true; pactl set-default-source "$SINK.monitor" 2>/dev/null || true; fi; exec
    ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_play_voice_001_s1
  name: 播放暂停与Space快捷键
  description: 覆盖1676289、1676291；录制语音后验证播放/暂停按钮及 Space 快捷键切换
  steps:
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      script: "(function(){\n  const btn = document.querySelector('button[data-format=\"\
        insertVoice\"]');\n  if (!btn) throw new Error('insertVoice button not found');\n\
        \  btn.click();\n  return true;\n})()\n"
    wait: 1.0
    note: 点击 Tiptap 录音按钮
  - step_type: action
    action: session_start
    command: bash -lc 'A=tests/at/fixtures/tengwanggexu.mp3; if command -v ffplay
      >/dev/null 2>&1; then timeout 5s ffplay -nodisp -autoexit -loglevel quiet "$A";
      elif command -v paplay >/dev/null 2>&1; then timeout 5s paplay "$A"; else xdg-open
      "$A"; fi'
    wait: 5.5
    note: 播放内置音频并录制约5秒
  - step_type: action
    action: element_action
    selector:
      name: StopButton
    do: click
    wait: 2.0
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 15
      script: "(function(){\n  return new Promise(function(resolve, reject){\n   \
        \ const deadline = Date.now() + 12000;\n    function poll(){\n      const\
        \ count = document.querySelectorAll('.voiceInfoBox[data-type=\"voice-block\"\
        ]').length;\n      if (count > 0) return resolve({voiceCount: count});\n \
        \     if (Date.now() > deadline) return reject(new Error('voice block not\
        \ generated'));\n      setTimeout(poll, 300);\n    }\n    poll();\n  });\n\
        })()\n"
    wait: 0.5
    note: 等待语音块生成
  - step_type: action
    action: webengine_mouse_event
    value:
      port: 9222
      target_url_contains: tiptap-editor
      selector: .voiceBtn
      button: left
    wait: 1.0
  - step_type: action
    action: webengine_mouse_event
    value:
      port: 9222
      target_url_contains: tiptap-editor
      selector: .voiceBtn
      button: left
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: TiptapWebView
    do: focus
    wait: 0.3
  - step_type: action
    action: keyboard_press
    key: space
    wait: 0.8
  - step_type: action
    action: keyboard_press
    key: space
    wait: 0.8
  assert_steps:
  - step_type: assert
    action: assert_process_running
    process: deepin-voice-note
  - step_type: assert
    action: assert_element
    selector:
      name: TiptapWebView
- id: suite_play_voice_002_s1
  name: 右键菜单_保存复制剪切删除
  description: 覆盖1676277、1676279、1676285、1676287、1676211；录制语音后右键复制/剪切/保存MP3/删除（Ctrl+Z 撤销录音插入【人工】）
  steps:
  - step_type: action
    action: command
    command: bash -lc 'rm -rf /tmp/voice_item.mp3'
    wait: 0.2
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      script: "(function(){\n  const btn = document.querySelector('button[data-format=\"\
        insertVoice\"]');\n  if (!btn) throw new Error('insertVoice button not found');\n\
        \  btn.click();\n  return true;\n})()\n"
    wait: 1.0
    note: 点击 Tiptap 录音按钮
  - step_type: action
    action: session_start
    command: bash -lc 'A=tests/at/fixtures/tengwanggexu.mp3; if command -v ffplay >/dev/null
      2>&1; then timeout 5s ffplay -nodisp -autoexit -loglevel quiet "$A"; elif command
      -v paplay >/dev/null 2>&1; then timeout 5s paplay "$A"; else xdg-open "$A"; fi'
    wait: 5.5
    note: 异步播放内置音频作为录音源（session_start 故意不等待进程结束）
  - step_type: action
    action: element_action
    selector:
      name: StopButton
    do: click
    wait: 2.0
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 20
      script: "(function(){\n  return new Promise(function(resolve, reject){\n    const\
        \ deadline = Date.now() + 15000;\n    function poll(){\n      const count =\
        \ document.querySelectorAll('.voiceInfoBox[data-type=\"voice-block\"]').length;\n\
        \      if (count > 0) return resolve({voiceCount: count});\n      if (Date.now()\
        \ > deadline) return reject(new Error('voice block not generated'));\n     \
        \ setTimeout(poll, 300);\n    }\n    poll();\n  });\n})()\n"
    wait: 0.5
    note: 等待语音块生成
  - step_type: action
    action: webengine_mouse_event
    value:
      port: 9222
      target_url_contains: tiptap-editor
      selector: .voiceInfoBox[data-type="voice-block"]
      button: right
    wait: 1.0
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/click_visible_menu_item.py 复制 --timeout 8'
    wait: 0.8
  - step_type: action
    action: webengine_mouse_event
    value:
      port: 9222
      target_url_contains: tiptap-editor
      selector: .ProseMirror p:last-child
      button: right
    wait: 1.0
    note: 复制后在正文空白段打开文本右键菜单
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/click_visible_menu_item.py 粘贴 --timeout 8'
    wait: 1.5
    note: 通过应用右键菜单粘贴复制的语音笔记
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 8
      script: "(function(){\n  const count = document.querySelectorAll('.voiceInfoBox[data-type=\"\
        voice-block\"]').length;\n  if (count < 2) throw new Error('voice block copy/paste\
        \ did not create second block, count=' + count);\n  return {voiceCount: count};\n\
        })()\n"
    wait: 0.5
  - step_type: action
    action: webengine_mouse_event
    value:
      port: 9222
      target_url_contains: tiptap-editor
      selector: .voiceInfoBox[data-type="voice-block"]
      button: right
    wait: 1.0
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/click_visible_menu_item.py 剪切 --timeout 8'
    wait: 1.0
    note: 通过语音块右键菜单剪切其中一条语音笔记
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 8
      script: "(function(){\n  const count = document.querySelectorAll('.voiceInfoBox[data-type=\"\
        voice-block\"]').length;\n  if (count < 1) throw new Error('voice block missing\
        \ after cut');\n  if (count > 1) throw new Error('voice block cut did not remove\
        \ selected block, count=' + count);\n  return {voiceCount: count};\n})()\n"
    wait: 0.5
  - step_type: action
    action: webengine_mouse_event
    value:
      port: 9222
      target_url_contains: tiptap-editor
      selector: .voiceInfoBox[data-type="voice-block"]
      button: right
    wait: 1.0
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/click_visible_menu_item.py 保存为MP3 --timeout
      8'
    wait: 1.5
    note: 同步点击可见菜单项；不可用 session_start（异步 Popen 不等待，会导致文件对话框未弹出）
  - step_type: action
    action: file_dialog_select
    path: /tmp/
    name: voice_item.mp3
    wait: 3.0
  - step_type: action
    action: webengine_mouse_event
    value:
      port: 9222
      target_url_contains: tiptap-editor
      selector: .voiceInfoBox[data-type="voice-block"]
      button: right
    wait: 1.0
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/click_visible_menu_item.py 删除 --timeout 8'
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_process_running
    process: deepin-voice-note
  - step_type: assert
    action: assert_element
    selector:
      name: TiptapWebView
  - step_type: assert
    action: assert_file_exists
    path: /tmp/voice_item.mp3
