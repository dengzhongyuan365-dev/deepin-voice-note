name: suite_play_voice_003_s1_suite
app: deepin-voice-note
module: play_voice
setup:
- action: session_start
  command: >-
    bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=9222; SINK=$(pactl get-default-sink 2>/dev/null || true); if [ -n "$SINK" ]; then pactl set-default-sink "$SINK" 2>/dev/null || true; pactl set-default-source "$SINK.monitor" 2>/dev/null || true; fi; exec ./tests/at/setup_voice_note_at.sh'
  wait: 8.0
teardown:
- action: session_stop
suites:
- id: suite_play_voice_003_s1
  name: 播放中_保存流程与编辑
  description: 覆盖1635089、1635083；录制语音后播放中进入保存语音流程，取消保存后验证语音仍存在并可继续编辑正文
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.8
    note: 新建笔记，确保 webVisible/recordBtnEnabled 后再录音
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: at_record_seed
    wait: 0.4
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      script: |
        (function(){
          const btn = document.querySelector('button[data-format="insertVoice"]');
          if (!btn) throw new Error('insertVoice button not found');
          btn.click();
          return true;
        })()
    wait: 1.0
    note: 点击 Tiptap 录音按钮
  - step_type: assert
    action: assert_element
    selector:
      name: PauseButton
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/play_loopback_audio.sh tests/at/fixtures/tengwanggexu.mp3 5'
    wait: 0.5
    note: command 播环回音频；禁止 session_start（会覆盖 app_process）
  - step_type: action
    action: element_action
    selector:
      name: StopButton
    do: click
    wait: 2.0
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 20
      script: |
        (function(){
          return new Promise(function(resolve, reject){
            const deadline = Date.now() + 15000;
            function poll(){
              const count = document.querySelectorAll('.voiceInfoBox[data-type="voice-block"]').length;
              if (count > 0) return resolve({voiceCount: count});
              if (Date.now() > deadline) return reject(new Error('voice block not generated'));
              setTimeout(poll, 300);
            }
            poll();
          });
        })()
    wait: 0.5
    note: 等待语音块生成
  - step_type: action
    action: webengine_mouse_event
    value:
      port: 9222
      target_url_contains: tiptap-editor
      selector: .voiceBtn
      button: left
    wait: 1.0
    note: 播放语音笔记
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/open_note_context_menu.py --index 0 --expect 保存语音 --click-expect --timeout 15'
    wait: 1.0
    note: 播放中打开笔记右键并点击保存语音
  - step_type: action
    action: file_dialog_cancel
    wait: 1.0
    note: 取消保存语音目录选择对话框
  - step_type: action
    action: wait
    wait: 5.0
    note: 等待语音播放自然结束
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      timeout: 5
      script: |
        (function(){
          const count = document.querySelectorAll('.voiceInfoBox[data-type="voice-block"]').length;
          if (count < 1) throw new Error('voice block missing after save flow');
          return {voiceCount: count};
        })()
    wait: 0.5
  - step_type: action
    action: element_action
    selector:
      name: TiptapWebView
    do: click
    wait: 0.5
  - step_type: action
    action: keyboard_type
    text: play_edit_001
    wait: 0.5
  assert_steps:
  - step_type: assert
    action: assert_process_running
    process: deepin-voice-note
  - step_type: assert
    action: assert_element
    selector:
      name: TiptapWebView
