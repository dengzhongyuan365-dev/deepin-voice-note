name: suite_play_voice_007_s1_suite
app: deepin-voice-note
module: play_voice
setup:
- action: session_start
  command: >-
    bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=9222; SINK=$(pactl get-default-sink 2>/dev/null || true); if [ -n "$SINK" ]; then pactl set-default-sink "$SINK" 2>/dev/null || true; pactl set-default-source "$SINK.monitor" 2>/dev/null || true; fi; exec ./tests/at/setup_voice_note_at.sh'
  wait: 8.0
teardown:
- action: session_stop
suites:
- id: suite_play_voice_007_s1
  name: 录音过程中新建编辑与右键笔记
  description: 覆盖1635021、1635023、1635025、1635033；录音过程中点击新建笔记、编辑正文、右键当前/其他笔记，验证录音条仍在且主界面可用（置灰态人工）
  steps:
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.6
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: rec_other_note_seed
    wait: 0.4
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.6
  - step_type: action
    action: webengine_eval_js
    value:
      port: 9222
      target_url_contains: tiptap-editor
      script: |
        (function(){
          const btn = document.querySelector('button[data-format="insertVoice"]');
          if (!btn) throw new Error('insertVoice button not found');
          btn.click();
          return true;
        })()
    wait: 1.0
  - step_type: assert
    action: assert_element
    selector:
      name: PauseButton
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/play_loopback_audio.sh tests/at/fixtures/tengwanggexu.mp3 10'
    wait: 0.5
    note: command 播环回音频；禁止 session_start（会覆盖 app_process）
  - step_type: assert
    action: assert_element
    selector:
      name: PauseButton
  - step_type: action
    action: element_action
    selector:
      name: NewNoteButton
    do: click
    wait: 0.8
    note: 录音中点击新建（产品置灰，断言不崩溃）
  - step_type: action
    action: mouse_click
    selector:
      name: NoteContentWebView
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: rec_edit_while_recording
    wait: 0.4
    note: 录音中编辑当前文本笔记
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/open_note_context_menu.py --index 0 --expect 重命名 --timeout 12'
    wait: 1.0
    note: 录音中右键当前笔记，菜单项可见后不点击
  - step_type: action
    action: keyboard_press
    key: Escape
    wait: 0.8
  - step_type: action
    action: command
    command: >-
      bash -lc 'set +e; ./tests/at/scripts/open_note_context_menu.py --index -1 --expect 重命名 --timeout 3; ec=$?;
      if [ "$ec" -eq 0 ]; then echo "FAIL: other-note context menu should be blocked while recording" >&2; exit 1; fi;
      echo "OK: other-note context menu blocked while recording (exit=$ec)"; exit 0'
    wait: 0.5
    note: 产品在录音中拦截非当前笔记右键（ItemListView），不应弹出重命名菜单；不崩溃即可
  - step_type: action
    action: keyboard_press
    key: Escape
    wait: 0.3
  - step_type: assert
    action: assert_element
    selector:
      name: PauseButton
  - step_type: action
    action: element_action
    selector:
      name: StopButton
    do: click
    wait: 2.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - step_type: assert
    action: assert_element
    selector:
      name: NoteItemListView
