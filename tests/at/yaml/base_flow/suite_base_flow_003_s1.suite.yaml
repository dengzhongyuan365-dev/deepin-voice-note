name: suite_base_flow_003_s1_suite
app: deepin-voice-note
module: base_flow
setup:
- action: session_start
  command: bash -lc 'exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
teardown:
- action: session_stop
suites:
- id: suite_base_flow_003_s1
  name: 压力_连续新建删除_记事本与文本笔记
  description: 覆盖1635299、1635301；AT 用连续新建/删除 5 个记事本 + 5 个文本笔记覆盖同一路径（原手测为20次），验证无崩溃且数量恢复
  steps:
  - step_type: action
    action: command
    command: bash -lc './tests/at/scripts/base_flow_actions.py pressure-create-delete --folders 5 --notes 5 --timeout 8 --interval 0.08'
    timeout: 90
    wait: 1.0
    note: 5 次新建/删除已覆盖压力路径；单步超时 90s，避免假性“预计十余分钟”
  assert_steps:
  - step_type: assert
    action: assert_process_running
    process: deepin-voice-note
  - step_type: assert
    action: assert_element
    selector:
      name: VoiceNoteMainWindow
  - step_type: assert
    action: assert_element
    selector:
      name: CreateFolderButton
  - step_type: assert
    action: assert_element
    selector:
      name: NewNoteButton
