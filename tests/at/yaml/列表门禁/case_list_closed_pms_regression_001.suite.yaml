name: PMS 已关闭列表 Bug 回归
app: deepin-voice-note
description: 回归 10 个已关闭的语音记事本有序/无序/待办列表操作 Bug
module: 列表门禁
tags:
- regression
- pms
- closed
- list
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
suites:
- id: pms_closed_381039_first_item_tab
  name: BUG-381039 多级列表第一行一级项按 Tab 可降级为二级
  tags:
  - regression
  - pms
  - '381039'
  - tab
  - first-item
  steps:
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      selector: .ProseMirror
      button: left
      event: click
    wait_after: 500
  - action: keyboard_hot_key
    key: ctrl+a
    wait_after: 450
  - action: keyboard_press
    key: backspace
    wait_after: 400
  - action: keyboard_type
    text: A
    wait_after: 300
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      selector: button[data-format=bulletList]
      button: left
      event: click
    wait_after: 500
  - action: keyboard_press
    key: end
    wait_after: 400
  - action: keyboard_press
    key: return
    wait_after: 550
  - action: keyboard_type
    text: B
    wait_after: 300
  - action: keyboard_press
    key: end
    wait_after: 400
  - action: keyboard_press
    key: return
    wait_after: 550
  - action: keyboard_type
    text: C
    wait_after: 300
  - action: keyboard_press
    key: end
    wait_after: 400
  - action: keyboard_press
    key: return
    wait_after: 550
  - action: keyboard_type
    text: D
    wait_after: 300
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script_file: tests/at/js/list-visual-model.js
    wait_after: 250
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { __dvnVisual.focusItem('A'); return true; })()
    wait_after: 350
  - action: keyboard_press
    key: tab
    wait_after: 700
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { __dvnVisual.assertDocumentTextOrder(['A','B','C','D']); __dvnVisual.assertLevels({A:2,B:1,C:1,D:1}); __dvnVisual.assertListTypes({A:'bulletList',B:'bulletList',C:'bulletList',D:'bulletList'}); return true; })()
    wait_after: 250

