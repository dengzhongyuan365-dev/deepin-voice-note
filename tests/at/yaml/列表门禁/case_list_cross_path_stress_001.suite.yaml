  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { __dvnVisual.clickCheckbox('B'); return true; })()
    wait_after: 500
  - action: webengine_eval_js
    value:
      port: 7777
