    value:
      port: 7777
      url_contains: tiptap-editor
      selector: .ProseMirror
      button: left
      event: click
    wait_after: 500
  - action: keyboard_hot_key
    key: ctrl+a
    wait_after: 450
  - action: keyboard_press
    key: backspace
    wait_after: 400
  - action: keyboard_type
    text: A
    wait_after: 300
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      selector: button[data-format=taskList]
      button: left
      event: click
    wait_after: 500
