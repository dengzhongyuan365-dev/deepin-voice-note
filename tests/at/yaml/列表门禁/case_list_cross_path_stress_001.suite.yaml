name: 列表跨路径压力门禁
app: deepin-voice-note
description: 父子转换、编号分支转换、三种列表混排局部转换与历史恢复
module: 列表门禁
tags:
- gate
- stress
- list
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
suites:
