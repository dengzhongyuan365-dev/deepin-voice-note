name: 真实用户演化与重复任务文字探测
app: deepin-voice-note
description: 无setContent；键盘输入和CDP鼠标；逐检查点对整篇逐行校验，区分同名任务。产品源码禁止随用例变更。
module: 列表门禁
tags:
- gate
- discovery
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
suites:
- id: journey_split_unique_task_text
