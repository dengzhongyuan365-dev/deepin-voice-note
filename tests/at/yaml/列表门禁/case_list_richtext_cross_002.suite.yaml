name: 富文本字号斜体连续输入与待办三级视觉边界 AT
app: deepin-voice-note
description: 真实键鼠建17行混合待办，选中P2应用20px字号+斜体，在行尾继续输入Z，改动另一分支勾选后反缩进与缩进，完整检查实际文档顺序/层级/勾选/编号以及文本格式。
module: 列表门禁
tags:
- gate
- discovery
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
