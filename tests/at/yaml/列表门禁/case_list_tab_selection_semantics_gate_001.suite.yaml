  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: "(() => {\n  const root=document.querySelector('.ProseMirror');\n  const\
        \ actual=Array.from(root.querySelectorAll('p')).map(p=>p.textContent.replace(/\\\
        u00a0/g,'')).filter(Boolean);\n  if(JSON.stringify(actual)!==JSON.stringify(['P','A','B']))\
        \ throw new Error('document text order mismatch: '+JSON.stringify(actual));\n\
        \  const plain=Array.from(root.querySelectorAll('p')).find(p=>p.textContent.replace(/\\\
        u00a0/g,'')==='P');\n  if(!plain) throw new Error('P missing');\n  if(plain.closest('li'))\
        \ throw new Error('P must remain a plain paragraph');\n  __dvnVisual.assertListTypes({A:'bulletList',B:'bulletList'});\n\
        \  __dvnVisual.assertLevels({A:2,B:2});\n  return true;\n})()"
    wait_after: 250
