    wait_after: 250
- id: tab_plain_text_selection_indents_without_loss
  name: 普通文字选区按 Tab：保留文字并产生文本缩进
  tags:
  - gate
  - tab
  - selection
  - plain
  steps:
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      selector: .ProseMirror
      button: left
      event: click
    wait_after: 600
  - action: keyboard_hot_key
    key: ctrl+a
    wait_after: 450
  - action: keyboard_press
    key: backspace
    wait_after: 450
  - action: keyboard_type
    text: ABC
    wait_after: 300
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      selector: .ProseMirror > p
      button: left
      event: click
      offset_x: 10
    wait_after: 400
  - action: keyboard_press
    key: home
    wait_after: 450
  - action: keyboard_hot_key
    key: shift+end
    wait_after: 450
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: "(() => {\n     const ed=window.__dvnTiptapEditor;\n     const active=document.activeElement;\n\
        \     if(!active || !active.classList.contains('ProseMirror')) throw new Error('editor\
        \ must own focus before Tab');\n     if(!ed || ed.state.selection.empty) throw\
        \ new Error('plain text selection must be non-empty');\n     const p=document.querySelector('.ProseMirror\
        \ > p');\n     const walker=document.createTreeWalker(p,NodeFilter.SHOW_TEXT);\n\
        \     const node=Array.from({length:20},()=>walker.nextNode()).find(n=>n &&\
        \ n.textContent.includes('ABC'));\n     if(!node) throw new Error('ABC text\
        \ node missing before Tab');\n     const range=document.createRange(); range.selectNodeContents(node);\n\
        \     globalThis.__atPlainTextLeft=range.getBoundingClientRect().left;\n \
        \    return true;\n   })()"
    wait_after: 250
  - action: keyboard_press
    key: tab
    wait_after: 700
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: "(() => {\n  const root=document.querySelector('.ProseMirror');\n  const\
        \ p=root.querySelector('p');\n  const normalized=(p?.textContent||'').replace(/\\\
        u00a0/g,'');\n  if(normalized!=='ABC') throw new Error('plain text content\
        \ lost: '+JSON.stringify(p?.textContent));\n  const walker=document.createTreeWalker(p,NodeFilter.SHOW_TEXT);\n\
        \  const node=Array.from({length:20},()=>walker.nextNode()).find(n=>n && n.textContent.includes('ABC'));\n\
        \  if(!node) throw new Error('ABC text node missing after Tab');\n  const\
        \ index=node.textContent.indexOf('ABC');\n  const range=document.createRange();\n\
        \  range.setStart(node,index); range.setEnd(node,index+3);\n  const left=range.getBoundingClientRect().left;\n\
        \  if(!(left>globalThis.__atPlainTextLeft+1)) throw new Error('plain text\
        \ was not visually indented: '+globalThis.__atPlainTextLeft+' -> '+left);\n\
        \  return true;\n})()"
    wait_after: 250
