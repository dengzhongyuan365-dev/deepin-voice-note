name: Tab 选区语义门禁
app: deepin-voice-note
description: 验证列表、普通文字及混合选区按 Tab 时按块缩进且不丢正文
module: 列表门禁
tags:
- gate
- tab
- selection
- regression
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
suites:
- id: tab_all_list_selection_preserves_and_indents
  name: 列表整体选区按 Tab：每个选中项各升一级
  tags:
  - gate
  - tab
  - selection
  - list
  steps:
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      selector: .ProseMirror
      button: left
      event: click
    wait_after: 600
  - action: keyboard_hot_key
    key: ctrl+a
    wait_after: 450
  - action: keyboard_press
    key: backspace
    wait_after: 450
  - action: keyboard_type
    text: A
    wait_after: 300
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      selector: button[data-format=bulletList]
      button: left
      event: click
    wait_after: 500
  - action: keyboard_press
    key: end
    wait_after: 450
  - action: keyboard_press
    key: return
    wait_after: 450
  - action: keyboard_type
    text: B
    wait_after: 300
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      selector: .ProseMirror > ul > li:nth-child(1) > p
      button: left
      event: click
      offset_x: 10
    wait_after: 400
  - action: keyboard_hot_key
    key: ctrl+a
    wait_after: 500
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: "(() => {\n      const ed=window.__dvnTiptapEditor;\n      const active=document.activeElement;\n\
        \      if(!active || !active.classList.contains('ProseMirror')) throw new\
        \ Error('editor must own focus before Tab');\n      if(!ed || ed.state.selection.empty)\
        \ throw new Error('selection must be non-empty before Tab');\n      const\
        \ selected=ed.state.doc.textBetween(ed.state.selection.from,ed.state.selection.to,'\\\
        n').replace(/[\\s\\u00a0]+/g,'');\n      if(selected.indexOf('AB')<0) throw\
        \ new Error('unexpected selection: '+JSON.stringify(selected));\n      return\
        \ true;\n    })()"
    wait_after: 250
  - action: keyboard_press
    key: tab
    wait_after: 700
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script_file: tests/at/js/list-visual-model.js
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: "(() => {\n     __dvnVisual.assertDocumentTextOrder(['A','B']);\n  \
        \   __dvnVisual.assertListTypes({A:'bulletList',B:'bulletList'});\n     __dvnVisual.assertLevels({A:2,B:2});\n\
        \     const text=document.querySelector('.ProseMirror').innerText;\n     if(text.includes('\\\
        u00a0')) throw new Error('list selection must not be replaced by NBSP');\n\
        \     if(window.__dvnTiptapEditor.state.selection.empty) throw new Error('selection\
        \ should remain after Tab');\n     return true;\n   })()"
    wait_after: 250
