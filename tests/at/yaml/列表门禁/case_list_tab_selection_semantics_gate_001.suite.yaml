      script: "(() => {\n      const ed=window.__dvnTiptapEditor;\n      const active=document.activeElement;\n\
        \      if(!active || !active.classList.contains('ProseMirror')) throw new\
        \ Error('editor must own focus before Tab');\n      if(!ed || ed.state.selection.empty)\
        \ throw new Error('selection must be non-empty before Tab');\n      const\
        \ selected=ed.state.doc.textBetween(ed.state.selection.from,ed.state.selection.to,'\\\
        n').replace(/[\\s\\u00a0]+/g,'');\n      if(selected.indexOf('PAB')<0) throw\
        \ new Error('unexpected selection: '+JSON.stringify(selected));\n      return\
