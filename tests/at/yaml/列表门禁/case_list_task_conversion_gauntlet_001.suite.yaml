name: 16 节点混合树连续转换长链：任务/无序/有序/普通文本多次切换门禁
app: deepin-voice-note
description: 同一混合视觉树中 B1 连续执行任务→无序→有序→任务→普通文本→无序→有序→Shift+Tab 两级→任务，每一步全文核对类型、层级、勾选、两段有序编号和 Undo/Redo。
module: 列表门禁
tags:
- gate
- discovery
- real-input
- task
- convert
- ordered
- undo
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
suites:
- id: task_conversion_gauntlet_mixed_tree
  name: B1 九次转换长链与两段有序编号稳定性
