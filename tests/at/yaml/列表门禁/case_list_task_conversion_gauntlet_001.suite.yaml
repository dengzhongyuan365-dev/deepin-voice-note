        "attrs": {"checked": false, "dvnIndentLevel": 0}, "content": [{"type": "paragraph", "content": [{"type": "text", "text": "ROOT"}]}]}]}, {"type":
        "taskList", "attrs": {}, "content": [{"type": "taskItem", "attrs": {"checked": true, "dvnIndentLevel": 1}, "content": [{"type": "paragraph", "content":
        [{"type": "text", "text": "C1"}]}]}, {"type": "taskItem", "attrs": {"checked": false, "dvnIndentLevel": 1}, "content": [{"type": "paragraph", "content":
        [{"type": "text", "text": "C2"}]}]}]}, {"type": "orderedList", "attrs": {"start": 1}, "content": [{"type": "listItem", "attrs": {"dvnIndentLevel":
        1}, "content": [{"type": "paragraph", "content": [{"type": "text", "text": "O1"}]}]}, {"type": "listItem", "attrs": {"dvnIndentLevel": 1}, "content":
