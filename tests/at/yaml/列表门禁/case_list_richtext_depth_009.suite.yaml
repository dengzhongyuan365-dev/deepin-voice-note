name: 跨三级局部选区 × 文字双格式 × 混合列表转换及视觉编号交叉
app: deepin-voice-note
description: 在17行三级混合列表中，分别格式化P2/O2，再只选择P2第2字到U行尾着色，跨待办/有序/无序整体转换无序、UndoRedo；逐字检查首尾边界及全文序号勾选。
module: 列表门禁
tags:
- gate
- discovery
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
