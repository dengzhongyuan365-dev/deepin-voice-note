  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: __dvnJourney.checkpoint('empty_second_tab_to_third',[["ROOT","task",1,false,null],["A","task",2,false,null],["P2","task",3,true,null],["P3","task",3,false,null],["NEXT","task",2,false,null],["FIN","task",3,false,null]])
    wait_after: 250
  - action: webengine_eval_js
    value:
