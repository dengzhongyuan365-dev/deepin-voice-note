name: 待办局部两个字加粗背景色与勾选、历史、跨格式边界输入 AT
app: deepin-voice-note
description: 真实输入三级同名混合列表，将三级Q扩为Qtail，严格用键盘仅选Qt加粗和背景色，检查ail无格式；随后点击其父A取消、UndoRedo、在无格式行尾续输Z并再勾选，检查局部范围和全文。
module: 列表门禁
tags:
- gate
- discovery
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
