      url_contains: tiptap-editor
      script: __dvnJourney.checkpoint('empty_enter_to_first_level',[["ROOT","task",1,false,null],["A","task",2,false,null],["P2","task",3,true,null],["P3","task",3,false,null],["NEXT","task",2,false,null],["END","task",1,false,null]])
    wait_after: 250
  - action: webengine_eval_js
    value:
