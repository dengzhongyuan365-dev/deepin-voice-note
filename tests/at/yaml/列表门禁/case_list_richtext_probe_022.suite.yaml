name: 最小有序转普通再转待办视觉父项联动，仅4项
app: deepin-voice-note
description: 空文档键鼠建ROOT/A/P2三级并勾选P2，回车O有序→普通断开→转未勾选待办；明确普通段落时ROOT可勾选，回待办后ROOT/A应反勾。
module: 列表门禁
tags:
- gate
- discovery
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
suites:
- id: richtext_probe_022_rejoin_visual_task
  name: 最小有序转普通再转待办视觉父项联动，仅4项
  tags:
  - gate
  - real-input
  - richtext
  - mixed
  - task
  steps:
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      selector: .ProseMirror
      button: left
      event: click
    wait_after: 350
  - action: keyboard_hot_key
    key: ctrl+a
    wait_after: 300
  - action: keyboard_press
    key: backspace
    wait_after: 300
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script_file: tests/at/js/list-user-journey.js
    wait_after: 240
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script_file: tests/at/js/list-format-cross-check.js
    wait_after: 240
  - action: keyboard_type
    text: ROOT
    wait_after: 300
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      selector: button[data-format=taskList]
      button: left
      event: click
    wait_after: 380
  - action: keyboard_press
    key: end
    wait_after: 360
  - action: keyboard_press
    key: return
    wait_after: 360
  - action: keyboard_type
    text: A
    wait_after: 300
  - action: keyboard_press
    key: tab
    wait_after: 360
  - action: keyboard_press
    key: end
    wait_after: 360
  - action: keyboard_press
    key: return
    wait_after: 360
  - action: keyboard_type
    text: P2
    wait_after: 300
  - action: keyboard_press
    key: tab
    wait_after: 360
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: window.__minStage="created_three_level";(()=>{const e=__dvnTiptapEditor,s=e.state.selection;return {stage:window.__minStage,rows:__dvnJourney.rows(),selection:{from:s.from,to:s.to,dom:window.getSelection().toString()},stored:s.empty?e.state.storedMarks?.map(m=>m.type.name):null,marks:s.$from.marks().map(m=>m.type.name),rendered:__dvnFormatCross.snapshot().map(x=>x.runs)}})()
    wait_after: 250
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: __dvnJourney.checkpoint("minimal_three_level_before_check",[["ROOT", "task", 1, false, null], ["A", "task", 2, false, null], ["P2", "task",
        3, false, null]])
    wait_after: 250
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      journey_index: 2
      journey_kind: checkbox
      button: left
      event: click
      offset_x: 3
    wait_after: 380
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: window.__minStage="after_check_P2";(()=>{const e=__dvnTiptapEditor,s=e.state.selection;return {stage:window.__minStage,rows:__dvnJourney.rows(),selection:{from:s.from,to:s.to,dom:window.getSelection().toString()},stored:s.empty?e.state.storedMarks?.map(m=>m.type.name):null,marks:s.$from.marks().map(m=>m.type.name),rendered:__dvnFormatCross.snapshot().map(x=>x.runs)}})()
    wait_after: 250
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      event: click
      button: left
      offset_x: 3
      journey_index: 2
      journey_kind: text
    wait_after: 340
  - action: keyboard_press
    key: end
    wait_after: 350
  - action: keyboard_press
    key: return
    wait_after: 350
  - action: keyboard_type
    text: O
    wait_after: 300
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      event: click
      button: left
      offset_x: 3
      selector: button[data-format=orderedList]
    wait_after: 340
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: __dvnJourney.checkpoint("minimal_O_ordered_root_stays_checked",[["ROOT", "task", 1, true, null], ["A", "task", 2, true, null], ["P2", "task",
        3, true, null], ["O", "ordered", 3, null, 1]])
    wait_after: 260
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      event: click
      button: left
      offset_x: 3
      journey_index: 3
      journey_kind: text
    wait_after: 340
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      event: click
      button: left
      offset_x: 3
      selector: button[data-format=orderedList]
    wait_after: 340
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: __dvnJourney.checkpoint("minimal_O_plain_breaks_task_tree",[["ROOT", "task", 1, true, null], ["A", "task", 2, true, null], ["P2", "task",
        3, true, null], ["O", "plain", 0, null, null]])
    wait_after: 260
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      event: click
      button: left
      offset_x: 3
      journey_index: 3
      journey_kind: text
    wait_after: 340
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      event: click
      button: left
      offset_x: 3
      selector: button[data-format=taskList]
    wait_after: 340
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: __dvnJourney.checkpoint("minimal_O_task_reenters_visual_tree_unchecks_parents",[["ROOT", "task", 1, false, null], ["A", "task", 2, false,
        null], ["P2", "task", 3, true, null], ["O", "task", 3, false, null]])
    wait_after: 260
