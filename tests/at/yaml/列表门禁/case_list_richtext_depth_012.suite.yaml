name: 已勾选二级父项局部格式与三级混合子项：父项中间回车拆分诊断
app: deepin-voice-note
description: 在17行双同名分支及三级待办有序无序混排下，已完成二级父项AZ设斜体字号、三级P2设粗体背景；在父项文字中间Enter拆为A/Z，核对文本顺序、视觉层级、父子勾选和格式，并执行UndoRedo；不预设用户尚未确认的拆分后完成态规则。
module: 列表门禁
tags:
- gate
- discovery
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
