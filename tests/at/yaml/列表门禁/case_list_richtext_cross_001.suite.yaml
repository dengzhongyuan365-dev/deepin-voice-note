name: 富文本格式与三级待办/有序列表状态交叉门禁
app: deepin-voice-note
description: 真实键鼠建17行混合列表并勾选，选中三级P2全文应用粗体/前景色/背景色，反缩进/缩进/转有序/撤销重做，每步同时检查标记与实际渲染以及全文层级、勾选和编号。
module: 列表门禁
tags:
- gate
- discovery
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
suites:
- id: richtext_nested_task_marks_indent_convert_history
