name: 动态子项集合/同名待办转换与历史交叉 AT
app: deepin-voice-note
description: 从空文档真实键鼠创建三级混合树，已完成父项新建同名未完成子项，再跨分支重复勾选；已有待办子项转有序再转回，检查转换后的子集和编号，跨步骤Undo/Redo。每步全文显式断言。
module: 列表门禁
tags:
- gate
- discovery
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
suites:
- id: edge_enter_new_same_name_child_under_checked_parent
  name: 已完成二级A下P2回车新增同名A，交叉切换后方A/Q，再勾选/Undo/Redo
