name: 复杂混合视觉树：任务退出/恢复/直接取消与有序序号联动门禁
app: deepin-voice-note
description: 16 行扁平视觉混合树，包含任务、两段有序列表、无序列表和多级后代；真实键鼠执行 Shift+Tab 退出普通文本、重新加待办、直接取消、再次恢复和 Undo/Redo，每步全文核对类型、层级、勾选和有序编号。
module: 列表门禁
tags:
- gate
- discovery
- real-input
- task
- convert
- ordered
- undo
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
suites:
