name: 三级混合片段整体转待办后视觉边界和父项联动 AT
app: deepin-voice-note
description: 真实键鼠创建17行三级待办/有序/无序混合文档；局部多选有序O/O2+无序U转为同级待办，逐项完成，再反缩进末项并交叉取消，整篇断言序号/状态/层级/UndoRedo。
module: 列表门禁
tags:
- gate
- discovery
fast_fail: false
env_check: []
setup:
- action: session_start
