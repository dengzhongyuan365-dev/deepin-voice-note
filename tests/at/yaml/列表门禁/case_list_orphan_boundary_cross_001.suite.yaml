  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { __dvnVisual.assertDocumentTextOrder(['A','B','C','D','E','F','G','H','I','J','K','L']); __dvnVisual.assertLevels({A:3,B:2,C:3,D:2,E:1,F:2,G:2,H:1,I:1,J:1,K:1,L:1}); __dvnVisual.assertNumbers({A:1,B:1,C:1,D:2,E:1,F:1,G:2,H:2,I:3,J:4,K:5,L:6}); __dvnVisual.assertSelectionText('DEFG'); return true; })()
    wait_after: 250
  - action: keyboard_hot_key
    key: shift+tab
    wait_after: 800
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { const root=document.querySelector('.ProseMirror'); const e=window.__dvnTiptapEditor; const eEntry=Array.from(root.querySelectorAll('p')).find(p=>p.textContent.replace(/\u00a0/g,'')==='E'); if(!eEntry || eEntry.closest('li')) throw new Error('E must exit the list as a plain paragraph'); __dvnVisual.assertDocumentTextOrder(['A','B','C','D','E','F','G','H','I','J','K','L']); __dvnVisual.assertLevels({A:3,B:2,C:3,D:1,F:1,G:1,H:1,I:1,J:1,K:1,L:1}); __dvnVisual.assertNumbers({A:1,B:1,C:1,D:1,F:1,G:2,H:3,I:4,J:5,K:6,L:7}); __dvnVisual.assertSelectionText('DEFG'); return true; })()
    wait_after: 250
  - action: keyboard_press
    key: tab
    wait_after: 800
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { const root=document.querySelector('.ProseMirror'); const eEntry=Array.from(root.querySelectorAll('p')).find(p=>p.textContent.replace(/\u00a0/g,'')==='E'); if(!eEntry || eEntry.closest('li')) throw new Error('E must remain a plain paragraph after mixed Tab'); __dvnVisual.assertDocumentTextOrderIgnoringNbsp(['A','B','C','D','E','F','G','H','I','J','K','L']); __dvnVisual.assertLevels({A:3,B:2,C:3,D:2,F:2,G:2,H:1,I:1,J:1,K:1,L:1}); __dvnVisual.assertNumbers({A:1,B:1,C:1,D:2,F:1,G:2,H:1,I:2,J:3,K:4,L:5}); __dvnVisual.assertSelectionText('DEFG'); return true; })()
    wait_after: 250
  - action: keyboard_hot_key
