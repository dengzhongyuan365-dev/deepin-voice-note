      script: (() => { const root=document.querySelector('.ProseMirror'); const eEntry=Array.from(root.querySelectorAll('p')).find(p=>p.textContent.replace(/\u00a0/g,'')==='E'); if(!eEntry || eEntry.closest('li')) throw new Error('Undo must restore E outside list'); __dvnVisual.assertLevels({A:3,B:2,C:3,D:1,F:1,G:1,H:1,I:1,J:1,K:1,L:1}); __dvnVisual.assertSelectionText('DEFG'); return true; })()
    wait_after: 250
  - action: keyboard_hot_key
