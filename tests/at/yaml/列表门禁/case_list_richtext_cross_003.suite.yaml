name: 跨待办与有序多行局部着色后缩进和联动门禁
app: deepin-voice-note
description: 从空文档键鼠建17行三级混合列表，多选P/P2/O/O2并统一应用前景色+背景色；断言选区和格式不漏到A/U/另一同名分支；整体ShiftTab及UndoRedo、勾选局部项后核对全文视觉层级/编号/状态与颜色。
module: 列表门禁
tags:
- gate
- discovery
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
suites:
