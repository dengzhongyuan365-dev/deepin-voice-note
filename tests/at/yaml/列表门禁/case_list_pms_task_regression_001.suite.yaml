name: PMS 三种待办列表历史 Bug 回归
app: deepin-voice-note
description: 回归 BUG-382177、BUG-382181、BUG-382189 的待办父子勾选与 Enter 新增场景
module: 列表门禁
tags:
- regression
- pms
- task
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
suites:
- id: pms_bug_382177_moved_level3_not_parent
  name: BUG-382177 二级移动为三级后，勾选新三级不能联动原有三级
  tags:
  - regression
  - pms
  - '382177'
  - task
  - level-three
  steps:
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      selector: .ProseMirror
      button: left
      event: click
    wait_after: 500
  - action: keyboard_hot_key
    key: ctrl+a
    wait_after: 450
  - action: keyboard_press
    key: backspace
    wait_after: 400
  - action: keyboard_type
    text: A
    wait_after: 300
  - action: webengine_mouse_event
    value:
      port: 7777
      url_contains: tiptap-editor
      selector: button[data-format=taskList]
      button: left
      event: click
    wait_after: 500
  - action: keyboard_press
    key: end
    wait_after: 400
  - action: keyboard_press
    key: return
    wait_after: 550
  - action: keyboard_type
    text: B
    wait_after: 300
  - action: keyboard_press
    key: end
    wait_after: 400
  - action: keyboard_press
    key: return
    wait_after: 550
