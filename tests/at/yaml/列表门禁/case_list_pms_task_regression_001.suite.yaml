    wait_after: 300
  - action: keyboard_press
    key: end
    wait_after: 400
  - action: keyboard_press
    key: return
    wait_after: 550
  - action: keyboard_type
    text: E
    wait_after: 300
  - action: keyboard_press
    key: end
    wait_after: 400
  - action: keyboard_press
    key: return
    wait_after: 550
  - action: keyboard_type
    text: F
    wait_after: 300
  - action: keyboard_press
    key: end
    wait_after: 400
  - action: keyboard_press
    key: return
    wait_after: 550
  - action: keyboard_type
    text: G
    wait_after: 300
  - action: keyboard_press
    key: end
    wait_after: 400
  - action: keyboard_press
    key: return
    wait_after: 550
  - action: keyboard_type
    text: H
    wait_after: 300
  - action: keyboard_press
    key: end
    wait_after: 400
  - action: keyboard_press
    key: return
    wait_after: 550
  - action: keyboard_type
    text: I
    wait_after: 300
  - action: keyboard_press
    key: end
    wait_after: 400
  - action: keyboard_press
    key: return
    wait_after: 550
  - action: keyboard_type
    text: J
    wait_after: 300
  - action: keyboard_press
    key: end
    wait_after: 400
  - action: keyboard_press
    key: return
    wait_after: 550
  - action: keyboard_type
    text: K
    wait_after: 300
  - action: keyboard_press
    key: end
    wait_after: 400
  - action: keyboard_press
    key: return
    wait_after: 550
  - action: keyboard_type
    text: L
    wait_after: 300
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script_file: tests/at/js/list-visual-model.js
    wait_after: 250
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { __dvnVisual.focusItem('B'); return true; })()
    wait_after: 350
  - action: keyboard_press
    key: tab
    wait_after: 400
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { __dvnVisual.focusItem('C'); return true; })()
    wait_after: 350
  - action: keyboard_press
    key: tab
    wait_after: 400
  - action: keyboard_press
    key: tab
    wait_after: 400
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { __dvnVisual.focusItem('D'); return true; })()
    wait_after: 350
  - action: keyboard_press
    key: tab
    wait_after: 400
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { __dvnVisual.assertLevels({A:1,B:2,C:3,D:2,E:1,F:1,G:1,H:1,I:1,J:1,K:1,L:1}); return true; })()
    wait_after: 250
  - action: keyboard_press
    key: tab
    wait_after: 700
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { __dvnVisual.assertLevels({A:1,B:2,C:3,D:3,E:1,F:1,G:1,H:1,I:1,J:1,K:1,L:1}); return true; })()
    wait_after: 250
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { __dvnVisual.clickCheckbox('D'); return true; })()
    wait_after: 500
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { __dvnVisual.assertChecked({A:false,B:false,C:false,D:true,E:false,F:false,G:false,H:false,I:false,J:false,K:false,L:false}); return true; })()
    wait_after: 250
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { __dvnVisual.clickCheckbox('C'); return true; })()
    wait_after: 500
  - action: webengine_eval_js
    value:
      port: 7777
      url_contains: tiptap-editor
      script: (() => { __dvnVisual.assertChecked({A:true,B:true,C:true,D:true,E:false,F:false,G:false,H:false,I:false,J:false,K:false,L:false}); return true; })()
    wait_after: 250

