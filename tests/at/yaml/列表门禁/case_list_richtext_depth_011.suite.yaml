name: 同一待办行内两段相反文字格式：边界插字、跨分支返回、转有序历史链
app: deepin-voice-note
description: 在17行三级混合列表中将同名另一分支Q变Qtail，Qt设粗体背景、ail设斜体前景，光标移动到格式界面插入Z按左侧格式判定，再转有序并多步UndoRedo；每一步同时检查行内实际DOM与父任务编号。
module: 列表门禁
tags:
- gate
- discovery
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
