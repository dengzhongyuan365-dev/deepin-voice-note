name: 真实混合列表反向选区与历史探测
app: deepin-voice-note
description: 普通段落全选创建有序；三级混排、中途创建新项、反向选区、颜色、批量缩进反缩进、统一转换、连续三步Undo/Redo
module: 列表门禁
tags:
- gate
- discovery
fast_fail: false
env_check: []
setup:
- action: session_start
  command: bash -lc 'export QTWEBENGINE_REMOTE_DEBUGGING=7777; exec ./tests/at/setup_voice_note_at.sh'
  wait: 6.0
- action: wait
  wait: 3.0
teardown:
- action: session_stop
suites:
- id: journey_reverse_mixed_selection_history
